# Reference production layout for one region: two nodes behind your TLS terminator / load
# balancer, Postgres and Redis on the internal network only. Secrets come from the environment
# (`.env`), never from this file. Replace the example hostnames before use. List values
# (trusted_proxies, allowed_origins) go in a mounted net.toml passed as `command: [--config, ...]`.
services:
  node-a:
    image: aurix-net:latest
    build: ..
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits: { nofile: { soft: 65536, hard: 65536 } }   # one fd per connection
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }
    environment:
      NET__SERVER__ENVIRONMENT: production
      NET__SERVER__HTTP_ADDR: 0.0.0.0:8090
      NET__SERVER__REGION: ${REGION:-eu}
      NET__SERVER__PUBLIC_HOST: node-a.net.example.com
      NET__AUTH__GRANT_SECRET: ${GRANT_SECRET}
      # During a secret rotation (docs/deployment.md → Secrets and rotation):
      # NET__AUTH__GRANT_SECRET_PREVIOUS: ${GRANT_SECRET_PREVIOUS}
      NET__AUTH__ADMIN_TOKEN: ${ADMIN_TOKEN}
      NET__SERVER__METRICS_TOKEN: ${METRICS_TOKEN}
      NET__DATABASE__URL: postgres://aurix:${PG_PASSWORD}@postgres:5432/aurix_net?sslmode=disable
      NET__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ["8090:8090/tcp", "7000:7000/udp", "7443:7443/udp"]
    depends_on: [postgres, redis]
  node-b:
    image: aurix-net:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits: { nofile: { soft: 65536, hard: 65536 } }   # one fd per connection
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }
    environment:
      NET__SERVER__ENVIRONMENT: production
      NET__SERVER__HTTP_ADDR: 0.0.0.0:8090
      NET__SERVER__REGION: ${REGION:-eu}
      NET__SERVER__PUBLIC_HOST: node-b.net.example.com
      NET__AUTH__GRANT_SECRET: ${GRANT_SECRET}
      # During a secret rotation (docs/deployment.md → Secrets and rotation):
      # NET__AUTH__GRANT_SECRET_PREVIOUS: ${GRANT_SECRET_PREVIOUS}
      NET__AUTH__ADMIN_TOKEN: ${ADMIN_TOKEN}
      NET__SERVER__METRICS_TOKEN: ${METRICS_TOKEN}
      NET__DATABASE__URL: postgres://aurix:${PG_PASSWORD}@postgres:5432/aurix_net?sslmode=disable
      NET__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ["8091:8090/tcp", "7001:7000/udp", "7444:7443/udp"]
    depends_on: [postgres, redis]
  # Operator console: static files + same-origin reverse proxy of /v1/* and /healthz to a node.
  # Put it behind the same TLS terminator as the nodes; it holds no secrets (tokens live in the
  # operator's browser only).
  console:
    image: aurix-net-console:latest
    build: ../dashboard
    restart: unless-stopped
    environment:
      # Point at your LB / VIP in production: with a single node here the console 502s while it upgrades.
      NET_API_URL: http://node-a:8090
    ports: ["8080:8080/tcp"]
    depends_on: [node-a]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurix
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: aurix_net
    volumes: ["net-pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["net-redis:/data"]
  # Optional monitoring stack: `docker compose --profile monitoring up -d`. Prometheus scrapes
  # both nodes with METRICS_TOKEN (written to a file at start); Grafana ships the Aurix Net
  # dashboard and alert rules from deploy/monitoring. Change the Grafana admin password.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'printf "%s" "$$METRICS_TOKEN" > /etc/prometheus/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d'
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - net-prom:/prometheus
    depends_on: [node-a, node-b]
  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - net-grafana:/var/lib/grafana
    ports: ["3000:3000/tcp"]
    depends_on: [prometheus]
volumes:
  net-prom:
  net-grafana:
  net-pg: {}
  net-redis: {}
