name: ci
on:
  push:
    branches: [main, next]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aurix, POSTGRES_PASSWORD: aurix, POSTGRES_DB: aurix_net }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aurix" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: "wasm32-unknown-unknown, x86_64-pc-windows-gnu" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: migrations apply on a fresh database
        run: cargo run -p net-server -- --migrate-only
        env:
          NET__DATABASE__URL: postgres://aurix:aurix@127.0.0.1:5432/aurix_net
          NET__REDIS__URL: redis://127.0.0.1:6379/
      - name: aurix-sim wasm32 == native (golden hashes)
        run: |
          cargo build --release --target wasm32-unknown-unknown -p net-sim-wasm
          cargo build --release --target wasm32-unknown-unknown -p net-sim-guest
          cargo build --release -p net-sim-wasm
          cargo run -p net-sim-wasm --example golden_check
      - name: Godot 4 GDExtension builds against godot-cpp 4.2
        run: |
          cargo build --release -p net-ffi
          pip3 install --user scons
          git clone -q --depth 1 -b 4.2 https://github.com/godotengine/godot-cpp sdk/godot/godot-cpp
          (cd sdk/godot && ~/.local/bin/scons target=template_debug -j"$(nproc)" >/dev/null && ls -la bin)
      - name: Godot 4 GDExtension for Windows (MinGW, sdk/godot/README.md)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          cargo build --release -p net-ffi --target x86_64-pc-windows-gnu
          cd sdk/godot
          AURIX_NET_LIB=../../target/x86_64-pc-windows-gnu/release ~/.local/bin/scons platform=windows target=template_debug -j"$(nproc)" >/dev/null
          cmp aurix_net.gdextension "check~/addons/aurix_net/aurix_net.gdextension"
          # libaurix_net is linked in: aurix_net.gdextension names no dependency for Windows
          if x86_64-w64-mingw32-objdump -p bin/libaurixnet_godot.windows.template_debug.x86_64.dll | grep -i "DLL Name: aurix_net"; then exit 1; fi
          for os in linux windows; do
            test -f "bin/$(sed -n "s|^$os.debug.x86_64 = \"res://addons/aurix_net/bin/\(.*\)\"$|\1|p" aurix_net.gdextension)"
          done
      - name: C++ and Godot SDK formatting
        run: |
          pip3 install --user clang-format==18.1.8
          (cd sdk/cpp && ~/.local/bin/clang-format --dry-run -Werror aurix_net.hpp)
          (cd sdk/godot && ~/.local/bin/clang-format --dry-run -Werror src/*.cpp src/aurix_net_*.h)
      - name: aurix-sim C ABI (libaurix_net + ctest/sim.c, header up to date)
        run: |
          cargo build --release -p net-ffi
          python3 tools/gen_sim_header.py && git diff --exit-code -- crates/net-ffi/include sdk/cpp/aurix_sim.h sdk/godot/src/aurix_sim.h
          cmp crates/net-ffi/include/aurix_net.h sdk/cpp/aurix_net.h && cmp crates/net-ffi/include/aurix_net.h sdk/godot/src/aurix_net.h && cmp sdk/cpp/aurix_net.hpp sdk/godot/src/aurix_net.hpp
          g++ -std=c++17 sdk/cpp/render_tick_test.cpp -Isdk/cpp -Ltarget/release -laurix_net -Wl,-rpath,$PWD/target/release -o /tmp/render_tick_test && /tmp/render_tick_test
          g++ -std=c++17 -fsyntax-only sdk/cpp/sync_test.cpp -Isdk/cpp && g++ -std=c++17 -fsyntax-only sdk/cpp/echo_test.cpp -Isdk/cpp && g++ -std=c++17 -fsyntax-only sdk/cpp/lockstep_test.cpp -Isdk/cpp
          gcc -std=c11 -Wall -Wextra -Werror crates/net-ffi/ctest/sim.c -Ltarget/release -laurix_net -lm -Wl,-rpath,$PWD/target/release -o /tmp/sim_ctest
          /tmp/sim_ctest
      - name: "Unreal plugin (engine-free): stage natives, descriptor/UHT checks"
        run: |
          sdk/unreal/scripts/build_native.sh
          python3 sdk/unreal/scripts/check_plugin.py
          g++ -std=c++17 -fsyntax-only -x c++ sdk/unreal/AurixNet/Source/ThirdParty/AurixNetLibrary/include/aurix_net.h
      - name: artifacts for the SDK and console jobs
        uses: actions/upload-artifact@v7
        with:
          name: sim-and-server
          retention-days: 1
          if-no-files-found: error
          path: |
            target/wasm32-unknown-unknown/release/net_sim_wasm.wasm
            target/release/libnet_sim_wasm.so
            target/debug/aurix-net-server
            target/release/libaurix_net.so
            target/wasm32-unknown-unknown/release/net_sim_guest.wasm
      - name: Godot extension for the sdk-live job
        uses: actions/upload-artifact@v7
        with: { name: godot-extension, path: sdk/godot/bin, retention-days: 1, if-no-files-found: error }

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-audit,cargo-deny,cargo-cyclonedx" }
      - run: cargo audit
      - run: cargo deny check
      # CycloneDX SBOM of the node binary (what actually ships in the image).
      - run: cargo cyclonedx -f json --describe binaries --manifest-path crates/net-server/Cargo.toml
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: crates/net-server/aurix-net-server_bin.cdx.json, retention-days: 90 }

  sdk-web:
    runs-on: ubuntu-24.04
    needs: rust
    defaults: { run: { working-directory: sdk/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: sim-and-server, path: target }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test   # live echo test skips itself without NET_API_KEY

  sdk-csharp:
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: sim-and-server, path: target }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 8.0.x }
      - name: Unity SDK formatting
        working-directory: sdk/unity
        run: dotnet tool restore && dotnet csharpier --check Runtime Editor Weaver~ Samples~
      - name: Unity SDK .meta files
        working-directory: sdk/unity
        # Unity leaves out an asset of an installed package that has no .meta. It does not look
        # into folders and files whose names begin with a dot or end with a tilde.
        run: |
          assets=$(git ls-files | grep -v '\.meta$' | grep -vE '(^|/)(\.[^/]*|[^/]*~)(/|$)' | awk -F/ '{ p = ""; for (i = 1; i <= NF; i++) { p = p (i > 1 ? "/" : "") $i; print p } }' | sort -u)
          metas=$(git ls-files '*.meta' | sed 's/\.meta$//' | sort)
          diff <(echo "$assets") <(echo "$metas")
      - run: dotnet build -c Release "sdk/unity/BuildCheck~/managed-live/managed-live.csproj"
      - run: dotnet build -c Release "sdk/unity/BuildCheck~/managed-rehost/managed-rehost.csproj"
      - run: dotnet test -c Release "sdk/unity/BuildCheck~/managed-tests/managed-tests.csproj"
      - run: dotnet test -c Release "sdk/unity/BuildCheck~/web-check/web-check.csproj"   # the Web side of the client on a page without a browser
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Unity SDK Web plug-in, linked by the Emscripten of each editor
        working-directory: sdk/unity/BuildCheck~/web-check/plugin
        # Unity 2022.3 links a Web build with Emscripten 3.1.8 and Unity 6 with 3.1.38. The SDK is
        # installed as its README says: https://github.com/emscripten-core/emsdk
        run: |
          npm ci
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          for version in 3.1.8 3.1.38; do
            "$RUNNER_TEMP/emsdk/emsdk" install "$version"
            "$RUNNER_TEMP/emsdk/emsdk" activate "$version"
            (source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && emcc --version && npm test)
          done
      - run: dotnet run -c Release --project "sdk/unity/BuildCheck~/transports-check/transports-check.csproj"   # PurrNet/Mirror/FishNet transports against interface stubs; live part skips without NET_API_KEY
      - run: dotnet run -c Release --project "sdk/unity/BuildCheck~/framework-check/framework-check.csproj"   # gameplay framework (NetworkManager/SyncVar/RPC); live part skips without NET_API_KEY

  sdk-live:
    runs-on: ubuntu-24.04
    needs: rust
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aurix, POSTGRES_PASSWORD: aurix, POSTGRES_DB: aurix_net }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aurix" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      NET__DATABASE__URL: postgres://aurix:aurix@127.0.0.1:5432/aurix_net
      NET__REDIS__URL: redis://127.0.0.1:6379/
      NET__AUTH__ADMIN_TOKEN: ci-operator-token
      NET__AUTH__GRANT_SECRET: ci-grant-secret-ci-grant-secret-ci-grant
      NET_HTTP: http://127.0.0.1:8090
      NET_SLOW_HTTP: http://127.0.0.1:8197
      NET_LOSSY_HTTP: http://127.0.0.1:8198
      NET_PLAIN_HTTP: http://127.0.0.1:8199
      NET_CUT_HTTP: http://127.0.0.1:8202
      NET_BREAK_HTTP: http://127.0.0.1:8203
      NET_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: sim-and-server, path: target }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 8.0.x }
      - name: start a node
        run: |
          chmod +x target/debug/aurix-net-server
          target/debug/aurix-net-server --migrate-only
          nohup target/debug/aurix-net-server > /tmp/node.log 2>&1 &
          echo $! > /tmp/node.pid
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8090/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8090/healthz
      - name: project key and game module
        run: |
          key=$(curl -fs -X POST -H "Authorization: Bearer $NET__AUTH__ADMIN_TOKEN" -H 'content-type: application/json' \
            -d '{"name":"sdk-live"}' http://127.0.0.1:8090/v1/operator/projects | jq -r .key.key)
          echo "::add-mask::$key"
          echo "NET_API_KEY=$key" >> "$GITHUB_ENV"
          curl -fs -X PUT -H "Authorization: Bearer $key" -H 'content-type: application/wasm' \
            --data-binary @target/wasm32-unknown-unknown/release/net_sim_guest.wasm http://127.0.0.1:8090/v1/modules/physics-arena
      - name: proxies in front of the node (sdk/cpp/README.md)
        working-directory: sdk/web
        run: |
          npm ci
          npm run build
          nohup node test/slow-link.mjs 100 8197 > /tmp/slow-link.log 2>&1 &
          nohup node test/slow-link.mjs 0 8198 10 70 > /tmp/lossy-link.log 2>&1 &
          nohup node test/slow-link.mjs 0 8199 plain > /tmp/plain-link.log 2>&1 &
          nohup node test/slow-link.mjs 0 8202 cut auth > /tmp/cut-link.log 2>&1 &
          nohup node test/slow-link.mjs 100 8203 cut stats > /tmp/break-link.log 2>&1 &
      - name: Web SDK
        working-directory: sdk/web
        run: npm test
        env:
          NET_LOGIC: physics-arena
          NET_LOGIC_PROPS: '{"schema":"component Transform {\n pos: vec3 @range(-4096, 4096, 0.01)\n speed: f32\n}","position":"Transform.0"}'
      - name: C# SDK
        run: |
          export LD_LIBRARY_PATH=$PWD/target/release
          dotnet run -c Release --project "sdk/unity/BuildCheck~/managed-live/managed-live.csproj"
          dotnet run -c Release --project "sdk/unity/BuildCheck~/framework-check/framework-check.csproj"
          dotnet run -c Release --project "sdk/unity/BuildCheck~/transports-check/transports-check.csproj"
      - name: Rust client
        run: cargo run --release -p net-client --example relay_echo
      - name: C++ and C SDK
        run: |
          for t in echo_test sync_test lockstep_test; do
            g++ -std=c++17 sdk/cpp/$t.cpp -Isdk/cpp -Ltarget/release -laurix_net -Wl,-rpath,$PWD/target/release -o /tmp/$t
            /tmp/$t
          done
          gcc -std=c11 -Wall -Wextra -Werror crates/net-ffi/ctest/echo.c -Ltarget/release -laurix_net -Wl,-rpath,$PWD/target/release -o /tmp/c-echo
          /tmp/c-echo
      - name: room handed from one node to another (scripts/sdk-rehost-test.sh)
        run: |
          kill "$(cat /tmp/node.pid)"
          tail --pid="$(cat /tmp/node.pid)" -f /dev/null
          dotnet build -c Release "sdk/unity/BuildCheck~/managed-rehost/managed-rehost.csproj"
          BIN=target/debug/aurix-net-server scripts/sdk-rehost-test.sh
      - uses: actions/download-artifact@v8
        with: { name: godot-extension, path: sdk/godot/bin }
      # the engine the way godot-cpp's own CI gets it: the release archive, run headless
      - name: Godot SDK (scripts/godot-live-test.sh)
        env: { GODOT_VERSION: 4.2.2-stable }
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          GODOT="/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" BIN=target/debug/aurix-net-server scripts/godot-live-test.sh
      - name: node logs
        if: failure()
        run: tail -n 200 /tmp/node.log /tmp/aurix-net-A.log /tmp/aurix-net-B.log

  console:
    runs-on: ubuntu-24.04
    needs: rust
    defaults: { run: { working-directory: dashboard } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: aurix, POSTGRES_PASSWORD: aurix, POSTGRES_DB: aurix_net }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aurix" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.13.0
        ports: ["8474:8474", "26379:26379"]
    env:
      NET__DATABASE__URL: postgres://aurix:aurix@127.0.0.1:5432/aurix_net
      NET__REDIS__URL: redis://127.0.0.1:26379/   # through Toxiproxy: one spec takes Redis away
      NET__AUTH__ADMIN_TOKEN: ci-operator-token
      NET__AUTH__GRANT_SECRET: ci-grant-secret-ci-grant-secret-ci-grant
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/download-artifact@v8
        with: { name: sim-and-server, path: target }  # relative to the workspace, not to working-directory
      - name: start two nodes for the live e2e suite
        run: |
          curl -fs -d '{"name":"redis","listen":"0.0.0.0:26379","upstream":"redis:6379"}' http://127.0.0.1:8474/proxies
          chmod +x ../target/debug/aurix-net-server
          ../target/debug/aurix-net-server --migrate-only
          BIN=../target/debug/aurix-net-server ../scripts/two-nodes.sh start
          curl -fs http://127.0.0.1:8090/healthz
          curl -fs http://127.0.0.1:8091/healthz
      - run: for i in 1 2 3 4 5; do npx playwright install --with-deps chromium && break; sleep 20; done
      - run: npm run e2e
        env:
          CI: "1"
          NET_API_URL: http://127.0.0.1:8090
          AURIX_NET_E2E_TOKEN: ci-operator-token
          AURIX_NET_E2E_PEER: http://127.0.0.1:8091
          AURIX_NET_E2E_TOXIPROXY: http://127.0.0.1:8474
          NET_LIVE_REQUIRED: "1"
      - name: node logs
        if: failure()
        run: tail -n 200 /tmp/aurix-net-A.log /tmp/aurix-net-B.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: dashboard/playwright-report, retention-days: 7 }

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: aurix-net:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Image scan of what ships (distroless base + node binary): CRITICAL with a fix fails the job,
      # HIGH is reported (the base image lags Debian security updates by days, e.g. libssl3 which the
      # node — rustls — never loads).
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: aurix-net:ci, scanners: vuln, severity: HIGH,CRITICAL, ignore-unfixed: true, exit-code: "0" }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: aurix-net:ci, scanners: vuln, severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dashboard/Dockerfile
          push: false
          load: true
          tags: aurix-net-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
