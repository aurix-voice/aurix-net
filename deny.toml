[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (rsa) stays only in Cargo.lock via the disabled sqlx-mysql feature; cargo-deny
# resolves the enabled graph and does not see it (the ignore lives in .cargo/audit.toml for cargo-audit).
ignore = [
  # rsa (Marvin timing attack): now in the enabled graph through jsonwebtoken's rust_crypto backend
  # (RS256/RS384/RS512 verification); Aurix Net issues and verifies HS256 grants only. No fix upstream.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5 timing variability: p256/p384 via jsonwebtoken rust_crypto (ES256/ES384),
  # unused for HS256 grants; the fix needs elliptic-curve 0.14, which jsonwebtoken does not support yet.
  "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "OpenSSL", "BSL-1.0",
  "CDLA-Permissive-2.0", "0BSD",
]
# Our own server-side crates are AGPL-3.0-only by design; third-party AGPL stays rejected.
exceptions = [
  { allow = ["AGPL-3.0-only"], crate = "net-server" },
  { allow = ["AGPL-3.0-only"], crate = "net-rooms" },
  { allow = ["AGPL-3.0-only"], crate = "net-loadtest" },
  { allow = ["AGPL-3.0-only"], crate = "net-db" },
  { allow = ["AGPL-3.0-only"], crate = "net-control" },
  { allow = ["AGPL-3.0-only"], crate = "net-auth" },
  { allow = ["AGPL-3.0-only"], crate = "net-api" },
  { allow = ["AGPL-3.0-only"], crate = "net-game" },
  { allow = ["AGPL-3.0-only"], crate = "net-cli" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
